name: Build WexxyyTweaker EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter

      - name: Generate icon
        run: python WexxyyTweaker.py --make-icon

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --uac-admin
          --name WexxyyTweaker
          --icon W.ico
          --add-data "W.ico;."
          --collect-all customtkinter
          WexxyyTweaker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WexxyyTweaker
          path: dist/WexxyyTweaker.exe

